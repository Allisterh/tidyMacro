project:
  type: website
  # Quarto renders into its own project directory (no path warnings, and stale
  # pages get cleaned properly); sync-docs.sh then mirrors _output/ to ../docs,
  # which is what the published site is served from.
  output-dir: _output
  post-render: ./sync-docs.sh
  render:
    - index.qmd
    - 01_SR.qmd
    - 02_1_LR.qmd
    - 02_2_Mixed.qmd
    - 03_1_ExternalIV.qmd
    - 03_2_InternalIV.qmd
    - 03_3_Heteroskedasticity.qmd
    - 04_4_NonInvertibleShocks.qmd
    - 04_1_Sign.qmd
    - 04_2_Narrative.qmd
    - 04_3_Sign_ExternalIV.qmd
    - 05_1_LP_Primer.qmd
    - 05_2_LP_Syntax.qmd
    - 05_3_LP_Exo_IV.qmd
    - 05_4_LP_NL_StateDep.qmd
    - 06_LP_Panel.qmd
    - 07_LPDID.qmd
    - faq.qmd

page-layout: full

website:
  page-navigation: true
  back-to-top-navigation: true
  title: "tidyMacro"
  site-url: "https://tidymacro.netlify.app"
  repo-url: https://github.com/muhsinciftci/tidyMacro
  repo-subdir: _site
  repo-actions: [edit, issue]
  favicon: logo.png

  open-graph:
    title: "tidyMacro"
    description: "High-Performance Structural Vector Autoregressions (SVARs) and Local Projections in R"

  page-footer:
    right: "This page is built with [Quarto](https://quarto.org)."
    left: "&copy; 2025 Muhsin Ciftci · Goethe University Frankfurt"

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: faq.qmd
        text: FAQ

  sidebar:
    logo: "logo.png"
    pinned: true
    align: center
    tools:
      - icon: github
        href: https://github.com/muhsinciftci/tidyMacro
        text: "tidyMacro GitHub"
      - icon: file-pdf
        href: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7150339
        text: "Paper"
      - icon: linkedin
        href: https://www.linkedin.com/in/muhsin-ciftci/
        text: Linkedin
    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Main
        
      - href: 01_SR.qmd
        text: Short-run restrictions
        
      - href: 02_1_LR.qmd
        text: Long-run restrictions
        
      - href: 02_2_Mixed.qmd
        text: Mixed restrictions
        
      - href: 03_1_ExternalIV.qmd
        text: External Instruments and Weak IV
        
      - href: 04_4_NonInvertibleShocks.qmd
        text: Noninvertible shocks

      - href: 04_1_Sign.qmd
        text: Sign restrictions

      - href: 04_2_Narrative.qmd
        text: Narrative restrictions

      - href: 04_3_Sign_ExternalIV.qmd
        text: Sign restrictions and External instruments
        
      - href: 03_2_InternalIV.qmd
        text: Internal instruments
        
      - href: 03_3_Heteroskedasticity.qmd
        text: Heteroskedasticity
        
      - href: 05_1_LP_Primer.qmd
        text: LP Primer

      - href: 05_2_LP_Syntax.qmd
        text: LP Syntax Primer
        
      - href: 05_3_LP_Exo_IV.qmd
        text: LP with Exogenous Shocks and IV

      - href: 05_4_LP_NL_StateDep.qmd
        text: LP Nonlinear and State-Dependent
        
      - href: 06_LP_Panel.qmd
        text: LP Panel
        
      - href: 07_LPDID.qmd
        text: LP DID

format:
  html:
    theme: cosmo
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-expand: true
    toc-depth: 3
    code-fold: false
    highlight-style: github
    smooth-scroll: true
    link-external-newwindow: true
    number-sections: true

execute:
  freeze: auto
  warning: false
  message: false
